site_name: NavMin

theme:
  name: material
  language: ru
  features:
    - content.code.copy        # копируемые блоки кода
    - navigation.tabs          # вкладки для основных разделов
    - navigation.sections      # раскрывающиеся секции в боковом меню
    - navigation.top           # кнопка "наверх"
    - search.suggest           # подсказки при поиске
    - search.highlight         # подсветка результатов

plugins:
  - search
  - autorefs          # автоматические ссылки на заголовки
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
  - minify:
      minify_html: true
      minify_js: false   # чтобы избежать багов
      minify_css: false  # Material сам минифицирует CSS

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Главная: index.md

  - Для пользователей:
    - Обзор: user/index.md
    - Быстрый старт: user/quick-start.md
    - Дополнительные функции: user/features.md
    - Калибровка: user/calibration.md
    - Устранение неисправностей: user/troubleshooting.md

  - Для разработчиков:
    - Обзор: dev/index.md
    - Начало работы: dev/getting-started.md

    - Архитектура и протоколы:
      - Общая архитектура: dev/architecture/overview.md
      - Уточнения архитектуры: dev/architecture/architecture-updates.md
      - Открытые вопросы: dev/architecture/problems.md
      - Конфигурация: dev/architecture/configuration.md
      - Протокол STM32: dev/architecture/serial-protocol.md

    - Внутренние модули:
      - Core: dev/modules/core/index.md
      - Vision: dev/modules/vision/index.md
      - Turret: dev/modules/turret/index.md
      - UI: dev/modules/ui/index.md

    - Другие руководства и шаблоны:
      - Работа с Git и GitHub:
        - Обзор: dev/how-to/git/index.md
        - Начало работы: dev/how-to/git/getting-started.md
        - Командная работа: dev/how-to/git/team-workflow.md
        - Учебный план: dev/how-to/git/learning-plan.md
        - Шпаргалка по командам: dev/how-to/git/cheat-sheet.md
      - Типы диаграмм: dev/how-to/diagram-types.md
      - Шаблоны: dev/how-to/templates.md

  - API-справочник: api/index.md