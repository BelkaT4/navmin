vt11:
  architecture: shared_core_plus_day_and_thermal_profiles
  day_profile: visible appearance/edge/projection/geometry/HSV color
  thermal_profile: scale-adaptive thermal descriptors + MICRO + conservative ID-first REACQ
  auto_profile: legacy image-domain inference maps to DAY or THERMAL
  baseline: VT-10-HOTFIX-6-REV2-IDENTITY-FIRST
vt11_hotfix1:
  scope: THERMAL only; DAY profile unchanged
  thermal_scale: immutable BaseArea + confirmed CurrentArea + separate MICRO_SCALE
  thermal_identity: peak prominence + core compactness + radial hotspot profile + energy concentration
  reacq: permissive temporal admission; conservative aggregate confirmation; global scan independent of MOTION_BREAK after
    15 frames
  global_scan_interval_frames: 3
  night_dataset: use docs/THERMAL_DATASET_PROTOCOL_RU.md and scripts/Summarize-Thermal-Diagnostics.py

vt11_hotfix2:
  scope: THERMAL only; DAY profile unchanged
  principle: reliable-anchor continuity before far-jump acceptance
  spatial_guard: normalized ReliableAnchor innovation + prediction error
  jump_quarantine_px: 55.0
  extreme_jump_px: 80.0
  local_identity_deficit_max: 0.35
  single_candidate_gap: neutral
  scale_updates_require_prediction_error_px_max: 30.0
  background_clutter: robust immediate-ring heterogeneity soft penalty
  source_diagnostics: diagnostic_bundle(20260909-031650) and diagnostic_bundle(20260909-031659)

vt11_hotfix3:
  scope: THERMAL only; DAY profile unchanged
  anti_function: learned static HUD mask becomes explicit negative evidence independent of motion self-consistency
  reticle_occlusion: freeze ReliableAnchor, scale and adaptation while predicted target crosses HUD; require temporal exit confirmation
  reacq: HUD hard-negative candidates cannot confirm REACQ/tracklets

# REV1 closure note / future work
future_operator_selected_suppression:
  planned: true
  concept: operator selects a nuisance object/ROI and the system builds a negative reference/mask for that object
  implemented_now: false
